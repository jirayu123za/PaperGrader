name: papergrader
services:
  postgres:
    image: postgres:16-alpine
    container_name: papergrader_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - papergrader-data:/var/lib/postgresql/data # change name
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - TIMEZONE=${TIMEZONE}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
    networks:
      - papergrader-net     
  backend:
    image: jirayu1004za/papergrader-backend:v1
    container_name: papergrader_backend
    depends_on:
      - postgres
      - minio
    environment:
      - PORT=${PORT}
      - DATABASE_DSN=${DATABASE_DSN}
      # - TIMEZONE=${TIMEZONE}
      - MINIO_PRIVATE_ENDPOINT=${MINIO_PRIVATE_ENDPOINT}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - MINIO_PRESIGN_TTL=${MINIO_PRESIGN_TTL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_REGION=${MINIO_REGION}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}      
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_PUBLIC_USE_SSL=${MINIO_PUBLIC_USE_SSL}
      # - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      # - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - EXPORT_GRADES_CRON=${EXPORT_GRADES_CRON}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - USERINFO_EMAIL=${USERINFO_EMAIL}
      - USERINFO_PROFILE=${USERINFO_PROFILE}
      - USERINFO=${USERINFO}
      - CMU_TENANT_ID=${CMU_TENANT_ID}
      - CMU_CLIENT_ID=${CMU_CLIENT_ID}
      - CMU_CLIENT_SECRET=${CMU_CLIENT_SECRET}
      - CMU_REDIRECT_URL=${CMU_REDIRECT_URL}
      - CMU_SCOPE=${CMU_SCOPE}
      - CMU_AUTH_URL=${CMU_AUTH_URL}
      - CMU_TOKEN_URL=${CMU_TOKEN_URL}
      - CMU_USERINFO_URL=${CMU_USERINFO_URL}
      - CMU_LOGOUT_URL=${CMU_LOGOUT_URL}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - FRONTEND_TOKEN=${FRONTEND_TOKEN}
      - FRONTEND_INSTRUCTOR_URL=${FRONTEND_INSTRUCTOR_URL}
      - FRONTEND_STUDENT_URL=${FRONTEND_STUDENT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - TESSDATA_PREFIX=/usr/share/tessdata
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./.env:/app/.env:ro
    tmpfs:
      - /app/tmp
    networks:
      - papergrader-net
  minio:
    image: minio/minio
    container_name: papergrader_minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT1:-9000}:9000"
      - "${MINIO_PORT2:-9001}:9001"
    volumes:
      - minio-data:/data
      #- papergrader-data:/var/lib/minio/data
    networks:
      - papergrader-net
networks:
  papergrader-net: # Check by using `docker network ls` command
    driver: bridge
volumes:
  papergrader-data:
  minio-data: